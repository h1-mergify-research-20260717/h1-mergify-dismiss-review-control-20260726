      alpha:
        include:
          - h1-scope-alpha/**
  barrier_files:
    include:
      - h1-barrier-fresh/**

commands_restrictions:
  queue:
    conditions:
      - sender = onecursor1-max

queue_rules:
  - name: H1 barrier rename fresh control 20260812
    queue_conditions:
      - base = h1-barrier-fresh-target-20260812
    merge_conditions:
      - check-success = H1_BARRIER_NEVER_20260812
