name: H1 trusted-user comment authorization gate

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  trusted-user-only:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.body == 'H1_TRUSTED_USER_ONLY_WORKFLOW_TRIGGER_20260727' &&
      github.event.comment.user.login == 'onecursor1-max'
    runs-on: ubuntu-latest
    steps:
      - name: Verify repository secret is available
        env:
          H1_CANARY: ${{ secrets.H1_AUTHORIZED_CANARY_20260727 }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${H1_CANARY}"
          printf '%s\n' 'H1_TRUSTED_USER_ONLY_CODE_EXECUTION_20260727' >> "${GITHUB_STEP_SUMMARY}"

      - name: Emit non-secret proof marker
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TRUSTED_ACTOR: ${{ github.event.comment.user.login }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -f body="H1_TRUSTED_USER_ONLY_WORKFLOW_EXECUTED_20260727 secret_present=true actor=${TRUSTED_ACTOR}"
