name: H1 Fork Secret Boundary Control

on:
  pull_request:

permissions:
  contents: read

jobs:
  boundary:
    name: H1 fork secret boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PR-controlled boundary probe
        shell: bash
        env:
          H1_FORK_BOUNDARY_CANARY: ${{ secrets.H1_FORK_BOUNDARY_CANARY_20260727 }}
        run: bash h1-fork-secret-probe.sh
