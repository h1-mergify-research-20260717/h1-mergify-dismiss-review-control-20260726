name: H1 fork GITHUB_TOKEN boundary

on:
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute pull-request-controlled token probe
        env:
          H1_GITHUB_TOKEN: ${{ github.token }}
          H1_REPOSITORY: ${{ github.repository }}
          H1_TARGET_ISSUE_NUMBER: "74"
        run: bash h1-fork-github-token-probe.sh
