name: H1 owner-comment authorization control

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  owner-only-command:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == 'onecursor1-max' &&
      github.event.comment.body == '/h1-owner-only-exec-20260727'
    runs-on: ubuntu-latest
    steps:
      - name: Record owner-authorized execution
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'H1_OWNER_ONLY_WORKFLOW_EXECUTED_20260727'
            })
