name: H1 source head freshness




on:
  pull_request:
  push:
    branches:
      - main




permissions:
  contents: read




jobs:
  freshness:
    name: H1 source head freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject updated unsafe source head
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            sleep 120
          fi
          if [[ -f h1-stale-head-unsafe.txt ]]; then
            echo "H1_STALE_SOURCE_HEAD_BROKEN_20260728"
            exit 1
          fi
          echo "H1_STALE_SOURCE_HEAD_SAFE_20260728"



