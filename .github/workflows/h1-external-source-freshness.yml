name: H1 external source head freshness

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  freshness:
    name: H1 external source head freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject untested external source update
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            sleep 120
          fi
          if [[ -f h1-external-stale-unsafe.txt ]]; then
            echo "H1_EXTERNAL_STALE_SOURCE_HEAD_BROKEN_20260728"
            exit 1
          fi
          echo "H1_EXTERNAL_STALE_SOURCE_HEAD_SAFE_20260728"
