name: H1 Skip Intermediate Protected Control

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  speculative-check:
    name: H1 skip intermediate protected control
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'mergify/merge-queue/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Validate protected cumulative state
        shell: bash
        run: |
          if [[ -f h1-protected-intermediate-bug.txt && ! -f h1-protected-intermediate-fix.txt ]]; then
            echo 'H1 protected deterministic bug present without fix'
            sleep 300
            exit 1
          fi
          echo 'H1 protected cumulative state is valid'

  main-observer:
    name: H1 protected main state observer
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Observe protected main state
        shell: bash
        run: |
          if [[ -f h1-protected-intermediate-bug.txt && ! -f h1-protected-intermediate-fix.txt ]]; then
            echo 'H1_PROTECTED_MAIN_BROKEN_INTERMEDIATE_STATE_20260727'
            exit 1
          fi
          echo 'H1 protected main state is valid'
