name: H1 barrier combined state workflow

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  guard:
    name: H1 barrier combined state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject only the unsafe combined state
        run: |
          if [[ -f h1-scope-alpha/alpha.txt && ! -f h1-barrier-control/global.txt ]]; then
            echo "H1_BARRIER_COMBINED_STATE_BROKEN_20260728"
            exit 1
          fi
          echo "H1_BARRIER_COMBINED_STATE_SAFE_20260728"
