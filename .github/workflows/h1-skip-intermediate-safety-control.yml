name: H1 Skip Intermediate Safety Control

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  speculative-check:
    name: H1 skip intermediate control
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'mergify/merge-queue/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Validate combined state
        shell: bash
        run: |
          if [[ -f h1-skip-intermediate-bug.txt && ! -f h1-skip-intermediate-fix.txt ]]; then
            echo 'H1 deterministic bug present without fix; keeping first batch pending before failure'
            sleep 180
            exit 1
          fi
          echo 'H1 combined state is valid'

  main-observer:
    name: H1 main state observer
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Observe main state
        shell: bash
        run: |
          if [[ -f h1-skip-intermediate-bug.txt && ! -f h1-skip-intermediate-fix.txt ]]; then
            echo 'H1_MAIN_BROKEN_INTERMEDIATE_STATE_20260727'
            exit 1
          fi
          echo 'H1 main state is valid'
