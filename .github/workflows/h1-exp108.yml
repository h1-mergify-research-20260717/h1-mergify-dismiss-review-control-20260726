name: H1 EXP108 token permission probe
on:
  pull_request:
    branches:
      - h1-exp108-target-1786867372
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PR-controlled CI hook
        env:
          GH_TOKEN: ${{ github.token }}
          H1_EXP108_SIDE_BRANCH: h1-exp108-side-1786867372
          H1_EXP108_MARKER_PATH: h1-exp108-token-write-1786867372.txt
        run: bash ./h1-exp108-ci.sh
