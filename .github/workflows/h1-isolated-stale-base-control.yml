name: H1 Isolated Stale Base Control

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  speculative-check:
    name: H1 isolated stale base control
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'mergify/merge-queue/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Validate latest base state
        shell: bash
        run: |
          if [[ -f h1-isolated-stale-a.txt && ! -f h1-isolated-stale-base.txt ]]; then
            echo 'H1 old-base speculative tree is waiting'
            sleep 180
            echo 'H1_ISOLATED_OLD_BASE_CHECK_PASSED_20260727'
            exit 0
          fi
          if [[ -f h1-isolated-stale-a.txt && -f h1-isolated-stale-base.txt ]]; then
            echo 'H1_ISOLATED_REVALIDATED_BASE_FAILURE_20260727'
            exit 1
          fi
          echo 'H1 isolated tree is valid'

  main-observer:
    name: H1 isolated main state observer
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Observe main state
        shell: bash
        run: |
          if [[ -f h1-isolated-stale-a.txt && -f h1-isolated-stale-base.txt ]]; then
            echo 'H1_ISOLATED_STALE_BASE_MERGED_20260727'
            exit 1
          fi
          echo 'H1 main state is valid'
