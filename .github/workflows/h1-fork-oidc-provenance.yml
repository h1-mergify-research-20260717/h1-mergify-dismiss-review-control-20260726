name: H1 fork OIDC provenance

on:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  oidc-probe:
    name: H1 fork OIDC provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run PR-controlled OIDC probe
        env:
          H1_OIDC_AUDIENCE: h1-mergify-owned-oidc-control-20260728
        run: bash h1-oidc-probe.sh

